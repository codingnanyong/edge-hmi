server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # sensor_status: explicit location so /sensor_status and /sensor_status/* are always proxied
    location /sensor_status {
        proxy_pass http://hmi-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy to hmi-api (other table APIs)
    location ~ ^/(openapi\.json|info|health|line_mst|equip_mst|sensor_mst|worker_mst|shift_cfg|kpi_cfg|alarm_cfg|maint_cfg|work_order|parts_mst|defect_code_mst|measurement|equip_status|prod_his|defect_his|alarm_his|maint_his|shift_map|kpi_sum)(/.*)?$ {
        proxy_pass http://hmi-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: try file, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
